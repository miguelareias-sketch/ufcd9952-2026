<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>PhotoStudio IA - Galeria Dinâmica</title>
    <style>
        body { font-family: sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; }
        .tag { background: #1f6feb; color: white; padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; margin-right: 5px; }
    </style>
</head>
<body>

    <h1>🖼️ Galeria PhotoStudio IA</h1>
    <div id="galeria" class="grid">A carregar fotografias via API...</div>

    <script>
        // Consome a API REST de forma assíncrona
        async function carregarGaleria() {
            try {
                // 1. Faz o pedido HTTP ao backend em PHP
                const resposta = await fetch('/api/fotografias.php');
                const resultado = await resposta.json();

                const container = document.getElementById('galeria');
                container.innerHTML = ''; // Limpa a mensagem inicial

                // 2. Constrói a interface dinamicamente com os dados recebidos
                resultado.dados.forEach(foto => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    const tagsHtml = foto.tags_ia.map(t => `<span class="tag">${t}</span>`).join('');

                    card.innerHTML = `
                        <img src="${foto.url_imagem}" 
                        alt="${foto.titulo}" 
                        style="width: 100%; height: 200px; object-fit: cover; border-radius: 6px;">
                        <h3>${foto.titulo}</h3>
                        <p><small>Data: ${foto.data_upload}</small></p>
                        <div>${tagsHtml}</div>
`                   ;
                    container.appendChild(card);
                });
            } catch (erro) {
                console.error("Erro ao ligar à API REST:", erro);
            }
        }

        // Executa ao carregar a página
        carregarGaleria();
    </script>
</body>
</html>
